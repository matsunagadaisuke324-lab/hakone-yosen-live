<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061f4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="予選会集計ツール"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-512.png"><title>予選会集計ツール 2026</title>
<style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#14213b;background:#f1f4f8}*{box-sizing:border-box}body{margin:0}header{background:#061f4a;color:white;padding:16px;text-align:center}h1{font-size:20px;margin:0}header small{opacity:.8}main{max-width:1100px;margin:auto;padding:12px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0015}h2{font-size:17px;margin:0 0 12px}.timer{text-align:center;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}.status{text-align:center;font-size:13px;color:#56667c;margin-bottom:10px}button,select{font:inherit}button{border:0;border-radius:9px;padding:12px 8px;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:not-allowed}.goal{background:#f39a20;color:white;width:100%;font-size:23px;padding:16px;margin:10px 0}.unis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.uni{background:#e8f0ff;color:#06245a;min-height:63px;font-size:13px}.uni small{display:block;font-size:12px;margin-top:4px}.uni.warning{background:#ffe5a0}.uni.done{background:#b7e7ce}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:105px;background:#e6ebf2;color:#12264a}.actions .danger,.danger{background:#b63d42;color:white}.pending{border:1px solid #efcb84;border-radius:9px;padding:9px;margin:8px 0;background:#fffaf0}.pending-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pending select,.history select{max-width:165px;padding:8px;border:1px solid #bbc6d7;border-radius:7px;background:white}.pending button,.history button{padding:8px;font-size:12px;background:#e8eef8}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #e7ebf1;text-align:left;white-space:nowrap}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.history{max-height:480px;overflow:auto}.history-row{padding:9px 0;border-bottom:1px solid #e7ebf1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.history-row .time{font-variant-numeric:tabular-nums;min-width:68px}.history-row .label{min-width:85px;font-weight:700}.muted{color:#68778d;font-size:12px}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#143d77;color:white;padding:12px 20px;border-radius:9px;z-index:20;box-shadow:0 4px 15px #0004;max-width:92vw;text-align:center;display:none}.toast.show{display:block}.toast.orange{background:#bb6c08}.toast.green{background:#17734a}.toast.red{background:#a9343d}@media(max-width:800px){.layout{grid-template-columns:1fr}.unis{grid-template-columns:repeat(3,minmax(0,1fr))}.timer{font-size:40px}main{padding:8px}.card{padding:11px}}
</style></head><body><header><h1>予選会集計ツール</h1><small>2026年版・14大学 / ゴール時刻差集計</small></header><div id="toast" class="toast" role="status" aria-live="polite"></div><main><div class="layout"><div><section class="card"><div class="timer" id="timer">00:00.0</div><div id="status" class="status">先頭選手の大学ボタンで計測開始</div><button id="goal" class="goal">🏃 GOAL（大学未判明）</button><div class="actions"><button id="undo">↩ 最後の記録を取消</button><button id="reset" class="danger">全データリセット</button></div><p class="muted">最初の大学ボタンを押した瞬間が0秒です。GOALは計測開始後に使用できます。</p></section><section class="card"><h2>大学ボタン</h2><div id="unis" class="unis"></div></section><section class="card"><h2>未割当GOAL <span id="pendingCount">0</span>件</h2><div id="pending"></div></section></div><div><section class="card"><h2>🏆 10人集計済み</h2><div class="tablewrap"><table><thead><tr><th>順位</th><th>大学</th><th class="num">人数</th><th class="num">合計差</th></tr></thead><tbody id="complete"></tbody></table></div></section><section class="card"><h2>⏱ 集計中</h2><div class="tablewrap"><table><thead><tr><th>大学</th><th class="num">人数</th><th class="num">合計差(暫定)</th></tr></thead><tbody id="progress"></tbody></table></div></section><section class="card"><h2>CSV出力</h2><div class="actions"><button id="exportHistory">全ゴール履歴CSV</button><button id="exportRank">大学順位CSV</button></div></section><section class="card"><h2>ゴール履歴・修正</h2><div id="history" class="history"></div></section></div></div></main>
<script>
'use strict';
const universities=[
{full:'中央学院大学',short:'中央学院'},{full:'東海大学',short:'東海'},{full:'神奈川大学',short:'神奈川'},{full:'東洋大学',short:'東洋'},{full:'日本体育大学',short:'日本体育'},{full:'東京国際大学',short:'東京国際'},{full:'山梨学院大学',short:'山梨学院'},{full:'東京農業大学',short:'東京農業'},{full:'大東文化大学',short:'大東文化'},{full:'立教大学',short:'立教'},{full:'法政大学',short:'法政'},{full:'明治大学',short:'明治'},{full:'専修大学',short:'専修'},{full:'国士舘大学',short:'国士舘'}];
const STORAGE_KEY='hakoneYosen2026Data';
let raceStartTimestamp=null,results=[],pendingGoals=[],nextGoalId=1,toastTimeout;
const $=id=>document.getElementById(id);
const known=new Set(universities.map(u=>u.short));
const ordered=(a,b)=>a.time-b.time||a.id-b.id;
function fmt(sec){if(!Number.isFinite(sec))return '—';let m=Math.floor(sec/60),s=sec-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0')}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(message,type=''){const el=$('toast');el.textContent=message;el.className='toast show '+type;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.className='toast',2200)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({raceStartTimestamp,results,pendingGoals,nextGoalId}))}catch(e){notify('保存できませんでした','red')}}
function restore(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!d)return;if(Number.isFinite(d.raceStartTimestamp))raceStartTimestamp=d.raceStartTimestamp;if(Array.isArray(d.results))results=d.results.filter(x=>Number.isFinite(x.id)&&known.has(x.university)&&Number.isFinite(x.time));if(Array.isArray(d.pendingGoals))pendingGoals=d.pendingGoals.filter(x=>Number.isFinite(x.id)&&Number.isFinite(x.time));const maxId=Math.max(0,...results.map(x=>x.id),...pendingGoals.map(x=>x.id));nextGoalId=Math.max(maxId+1,Number(d.nextGoalId)||1)}catch(e){notify('保存データの読み込みに失敗','red')}}
function recalc(){const counts={};results.sort(ordered);for(const r of results){counts[r.university]=(counts[r.university]||0)+1;r.count=counts[r.university];r.scoring=r.count<=10}}
function stats(){const s=new Map(universities.map(u=>[u.short,{...u,count:0,sum:0}]));for(const r of results){const x=s.get(r.university);if(x){x.count++;if(r.scoring)x.sum+=r.time}}return [...s.values()]}
function finish(university){if(!known.has(university))return;recalc();if(results.filter(r=>r.university===university).length>=10){notify(university+'は10人記録済み','orange');return}const now=Date.now();if(raceStartTimestamp===null)raceStartTimestamp=now;const t=Math.max(0,(now-raceStartTimestamp)/1000);results.push({id:nextGoalId++,university,time:t,count:0,scoring:true});commit();const n=results.filter(r=>r.university===university).length;notify(university+' '+n+'/10'+(n===10?' 集計完了':''),n===10?'green':'')}
function goal(){if(raceStartTimestamp===null){notify('先に最初の大学ボタンを押してください','orange');return}pendingGoals.push({id:nextGoalId++,time:Math.max(0,(Date.now()-raceStartTimestamp)/1000)});commit();notify('GOAL記録・大学未割当','orange')}
function assign(id,university){if(!known.has(university))return;const i=pendingGoals.findIndex(p=>p.id===id);if(i<0)return;const p=pendingGoals.splice(i,1)[0];results.push({...p,university,count:0,scoring:true});commit();notify(university+'に割り当てました','green')}
function edit(id,university){if(!known.has(university))return;const r=results.find(x=>x.id===id);if(!r)return;r.university=university;commit();notify('大学を修正しました','green')}
function remove(id){if(!confirm('このゴール記録を削除しますか？'))return;results=results.filter(x=>x.id!==id);pendingGoals=pendingGoals.filter(x=>x.id!==id);commit();notify('履歴を削除しました','red')}
function undo(){const maxId=Math.max(0,...results.map(x=>x.id),...pendingGoals.map(x=>x.id));if(!maxId)return notify('取り消す記録がありません','orange');if(!confirm('最後に記録したGOALを取り消しますか？'))return;results=results.filter(x=>x.id!==maxId);pendingGoals=pendingGoals.filter(x=>x.id!==maxId);commit();notify('最後のGOALを取り消しました','red')}
function reset(){if(!confirm('全記録を削除します。元に戻せません。よろしいですか？'))return;raceStartTimestamp=null;results=[];pendingGoals=[];nextGoalId=1;localStorage.removeItem(STORAGE_KEY);render();notify('リセットしました','red')}
function options(selected,placeholder=false){return (placeholder?'<option value="">大学を選択</option>':'')+universities.map(u=>'<option value="'+escapeHTML(u.short)+'"'+(u.short===selected?' selected':'')+'>'+escapeHTML(u.short)+'</option>').join('')}
function render(){recalc();const st=stats();$('unis').innerHTML=st.map(x=>'<button type="button" class="uni '+(x.count>=10?'done':x.count===9?'warning':'')+'" data-uni="'+escapeHTML(x.short)+'" '+(x.count>=10?'disabled':'')+'>'+escapeHTML(x.short)+'<small>'+Math.min(x.count,10)+'/10</small></button>').join('');$('pendingCount').textContent=pendingGoals.length;$('pending').innerHTML=pendingGoals.length?pendingGoals.slice().sort(ordered).map(p=>'<div class="pending"><div class="pending-row"><strong>#'+p.id+'　+'+fmt(p.time)+'</strong><select aria-label="大学を選択" data-pending="'+p.id+'">'+options('',true)+'</select><button data-assign="'+p.id+'">割当確定</button></div></div>').join(''):'<p class="muted">未割当はありません</p>';
const done=st.filter(x=>x.count>=10).sort((a,b)=>a.sum-b.sum||a.short.localeCompare(b.short,'ja'));$('complete').innerHTML=done.length?done.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHTML(x.short)+'</td><td class="num">10</td><td class="num">+'+fmt(x.sum)+'</td></tr>').join(''):'<tr><td colspan="4" class="muted">10人到達の大学はまだありません</td></tr>';
const active=st.filter(x=>x.count<10).sort((a,b)=>b.count-a.count||a.sum-b.sum);$('progress').innerHTML=active.map(x=>'<tr><td>'+escapeHTML(x.short)+'</td><td class="num">'+x.count+'/10</td><td class="num">+'+fmt(x.sum)+'</td></tr>').join('');
const all=[...results.map(r=>({...r,pending:false})),...pendingGoals.map(p=>({...p,pending:true}))].sort(ordered);$('history').innerHTML=all.length?all.map(r=>'<div class="history-row"><span class="time">#'+r.id+' +'+fmt(r.time)+'</span>'+(r.pending?'<span class="label">未割当</span>':'<span class="label">'+escapeHTML(r.university)+' '+r.count+'人目'+(r.scoring?'':' (対象外)')+'</span>')+(r.pending?'':'<select aria-label="大学修正" data-edit="'+r.id+'">'+options(r.university)+'</select><button data-save="'+r.id+'">修正</button>')+'<button class="danger" data-delete="'+r.id+'">削除</button></div>').join(''):'<p class="muted">ゴール履歴はありません</p>';updateTimer()}
function updateTimer(){if(raceStartTimestamp===null){$('timer').textContent='00:00.0';$('status').textContent='先頭選手の大学ボタンで計測開始';return}$('timer').textContent=fmt(Math.max(0,(Date.now()-raceStartTimestamp)/1000));$('status').textContent='計測中・ゴール '+(results.length+pendingGoals.length)+'件'}
function commit(){recalc();save();render()}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function downloadCSV(filename,rows){const csv='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHistory(){recalc();const all=[...results.map(r=>({...r,pending:false})),...pendingGoals.map(p=>({...p,pending:true}))].sort(ordered);downloadCSV('予選会集計ツール_全ゴール履歴.csv',[['ID','大学','先頭差(秒)','大学内順位','集計対象','未割当'],...all.map(r=>[r.id,r.pending?'未割当':r.university,r.time.toFixed(3),r.pending?'':r.count,r.pending?'':r.scoring?'対象':'対象外',r.pending?'はい':'いいえ'])])}
function exportRank(){recalc();const sorted=stats().sort((a,b)=>(a.count>=10?0:1)-(b.count>=10?0:1)||(a.count>=10?a.sum-b.sum:b.count-a.count)||a.sum-b.sum);let rank=0;downloadCSV('予選会集計ツール_大学順位.csv',[['順位(10人到達校)','大学','通過人数','先頭差合計(秒)','状態'],...sorted.map(x=>[x.count>=10?++rank:'',x.full,x.count,x.sum.toFixed(3),x.count>=10?'10人集計済み':'集計中'])])}
$('unis').addEventListener('click',e=>{const b=e.target.closest('[data-uni]');if(b)finish(b.dataset.uni)});$('goal').addEventListener('click',goal);$('undo').addEventListener('click',undo);$('reset').addEventListener('click',reset);$('exportHistory').addEventListener('click',exportHistory);$('exportRank').addEventListener('click',exportRank);$('pending').addEventListener('click',e=>{const b=e.target.closest('[data-assign]');if(!b)return;const id=Number(b.dataset.assign),sel=$('pending').querySelector('[data-pending="'+id+'"]');if(!sel.value)return notify('大学を選択してください','orange');assign(id,sel.value)});$('history').addEventListener('click',e=>{const d=e.target.closest('[data-delete]');if(d)return remove(Number(d.dataset.delete));const b=e.target.closest('[data-save]');if(b){const id=Number(b.dataset.save),sel=$('history').querySelector('[data-edit="'+id+'"]');edit(id,sel.value)}});
restore();render();setInterval(updateTimer,50);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
